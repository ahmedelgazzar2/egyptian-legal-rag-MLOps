[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "egyptian-legal-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
     # API 
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",

    # LangChain 
    "langchain",
    "langchain-community",
    "langchain-groq",
    "langchain-core",

    #  Vector Store 
    "faiss-cpu",

    #  Embeddings 
    "fastembed",
    "onnxruntime",

    #  PDF 
    "pypdf",

    # Utils 
    "python-dotenv",
    "langdetect",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",        
    "ruff",         
    "black",        
    "pre-commit",   
]

eval = [
    "mlflow",
    "ragas",
    "datasets>=3.0.0",
    "pyarrow>=17.0.0",
]

data = [
    "dvc",
    "optimum>=2.1.0",
    "accelerate>=1.15.0",
]

[tool.uv.extra-build-dependencies]
pyarrow = ["pkg_resources", "setuptools"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
exclude = ["notebooks", "nootbooks"]

[tool.ruff.lint] 
# to allow to depends function inside fastapi
ignore = ["B008" , "N999"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

# [tool.uv]
# environments = [
#     "sys_platform == 'linux' and python_version == '3.11'"
# ]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }