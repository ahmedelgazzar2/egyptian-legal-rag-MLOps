# ci-cd file
name: Egyptian Legal RAG - CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # CI
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Project & Dependencies
        run: |
          uv sync --all-extras --dev
          uv pip install -e .


      - name: Rebuild Index / Re-ingest Corpus (DVC Repro)
        run: |
          uv run dvc repro || uv run python -m Egyptian_legal_rag.data.ingest.py


      - name: Run Linters (Ruff & Black)
        run: |
          uv run ruff check .
          uv run black --check .

      - name: Run Unit Tests (FastAPI & API Health)
        run: |
          uv run pytest
      
      
  # 2. CD
  
  cd-pipeline:
    needs: ci-pipeline
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Project & Dependencies
        run: |
          uv sync --all-extras --dev
          uv pip install -e .

      - name: Run DVC Repro to generate vector stores for Docker
        run: |
          uv run dvc repro

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/egyptian-legal-rag-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/egyptian-legal-rag-api:${{ github.sha }}