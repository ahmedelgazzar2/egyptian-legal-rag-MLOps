[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "egyptian-legal-rag"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "langchain",
    "langchain-community",
    "langchain-groq",
    "langchain-core",
    "langchain-huggingface",
    "faiss-cpu",
    "sentence-transformers",
    "pypdf",
    "mlflow",
    "ragas",
    "dvc",
    "python-dotenv",
    "langdetect",
    "pydantic_settings",
    "optimum[onnxruntime]>=2.1.0",
    "pyarrow>=16.0.0",
    "onnxruntime>=1.24.3",
    "datasets>=2.20.0",
    "accelerate>=1.15.0",
    "fastembed"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",        
    "ruff",         
    "black",        
    "pre-commit",   
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
